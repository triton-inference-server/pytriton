[project]
name = "nvidia-pytriton-client"
readme = "../docs/pypi.rst"
description = "PyTriton - client-side package for macOS/Windows development environments."
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
authors = []
maintainers = []
keywords = []
license = { text = "Apache 2.0" }
requires-python = ">=3.8,<4"
dependencies = [
    "numpy >= 1.21, <2.0.0",
    "protobuf >= 3.7",
    "pyzmq >= 23.0",
    "sh >= 1.14",
    "tritonclient[grpc,http] ~= 2.50",
    "grpcio >= 1.64.3",
    "typing_inspect >= 0.6.0",
    "wrapt >= 1.11",
    "typer >= 0.9.0",
    "importlib_metadata >= 7.0.1",
]

[project.urls]
"Documentation" = "https://triton-inference-server.github.io/pytriton"
"Source" = "https://github.com/triton-inference-server/pytriton"
"Tracker" = "https://github.com/triton-inference-server/pytriton/issues"

[build-system]
requires = [
    "setuptools>=69.2.0",
    "setuptools_scm[toml]>=8.0",
    "wheel>=0.42",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
license-files = ["../LICENSE"]

[tool.setuptools.packages.find]
where = [".."]
namespaces = false
include = ["pytriton*"]

[tool.setuptools.package-data]
pytriton = [
    "**/*",
]

[tool.setuptools.exclude-package-data]
pytriton = [
    "tritonserver/**",
    "tritonserver/external_libs/*",
]

[tool.setuptools_scm]
root = ".."
